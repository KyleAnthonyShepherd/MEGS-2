# Continuous MEGS² training configuration — unbounded streaming mode.
# All timing signals are convergence states, not iteration counts.

# ---------------------------------------------------------------------------
# convergence — defines the four monitor states the trainer reacts to.
# ---------------------------------------------------------------------------
# The monitor keeps a rolling deque of EMA loss samples (one per iter) and
# returns one of: improving / stalled / wants_capacity / converged.
#
# Slope is computed as relative_slope = (recent[-1] - recent[0]) / window /
# recent[-1] — fraction of current loss per sample. More negative = faster
# improvement. Densify saturation is max(fraction-of-Gaussians-added)
# over the last `densify_window` densify events.
convergence:
  # Number of EMA loss samples in the rolling window. Bigger = smoother
  # state classification, slower to react. After monitor.reset() the state
  # machine waits for this many fresh samples (scaled by fraction_changed)
  # before any non-trivial state can fire again. Stalled-timeout promotion
  # also triggers after this many consecutive stalled samples.
  loss_window: 256

  # Number of recent densify events whose "fraction added" is averaged for
  # the densify saturation signal. Gates the wants_capacity state.
  densify_window: 10

  # Slope must be flatter (less negative) than this to be classified
  # converged. Originally -1e-4 — too tight, runs would park just outside
  # the converged band indefinitely. -5e-4 catches genuinely-flat slopes
  # without prematurely declaring convergence on improving runs.
  converged_slope: -2.0e-4

  # densify_saturation threshold for wants_capacity. If recent densifies
  # added > 5% of Gaussians AND slope is still steep, we want more capacity.
  active_densify: 0.05

  # Slope must be steeper than this to count as "actively improving".
  # The band (active_slope, converged_slope) is the stalled zone.
  active_slope: -1.0e-3

# ---------------------------------------------------------------------------
# triggers — when each structural change is allowed to fire.
# ---------------------------------------------------------------------------
# Each trigger has:
#   min_iters_between: anti-thrash floor in iters since the trigger last
#     fired. NOT a trigger; just prevents back-to-back firings.
#   require_state:     which monitor states permit the action.
# A trigger ALSO has additional substantive gates in scene/triggers.py
# (e.g. dead-fraction, growth-fraction, candidate-fraction) that must pass.
triggers:
  # Add Gaussians where high gradient or blur mask says detail is needed.
  # "stalled" is the bootstrap trigger (plateau → need capacity).
  # "wants_capacity" is the follow-up trigger (just densified, still
  # improving fast — keep going).
  densify:
    min_iters_between: 32
    require_state: ["stalled", "wants_capacity"]

  # Cheap opacity/size prune: drops dead splats (opacity below threshold)
  # and oversized ones. Fires when ≥ fast_prune_dead_fraction of the
  # population is dead AND the monitor allows it.
  fast_prune:
    min_iters_between: 16
    require_state: ["stalled", "converged"]

  # Importance-based prune: removes the bottom prune_ratio1 of Gaussians by
  # importance score (computed across all current cameras). Heavier and
  # more disruptive than fast_prune. Gated on converged so it only fires
  # once per cycle, not on every transient stall.
  lightweight_prune:
    min_iters_between: 64
    require_state: ["stalled"]

  # Spherical-Gaussian axis culling: drops dim/low-sharpness directional
  # bases. Runs at most once per convergence cycle in the idle path so it
  # gets a real converged state to act on.
  cull_sg_axes:
    min_iters_between: 128
    require_state: ["converged"]

# ---------------------------------------------------------------------------
# skipgs — SkipGS-style gradient gate.
# ---------------------------------------------------------------------------
# Stops backprop into Gaussians whose recent contribution to the loss is
# below a threshold. Saves compute on well-converged regions while new
# regions keep training.
skipgs:
  enabled: true
  # Consecutive "improving" samples after enablement before the gate
  # actually starts skipping. Lets the model settle into the new gradient
  # statistics first.
  warmup_steady_samples: 64
  # EMA decay on the per-Gaussian contribution signal.
  beta: 0.95
  # Numerical floor on the gate denominator.
  eps: 1.0e-8
  # Gate threshold: Gaussians with normalized contribution below this skip.
  rho_lo: 0.5

# ---------------------------------------------------------------------------
# bootstrap — minimum images before optimizer steps begin.
# ---------------------------------------------------------------------------
bootstrap:
  # Minimum registered images before optimizer steps begin. Kept equal to the
  # home-server's mapper gate (env SFM_MIN_IMAGES_TO_MAP, default 3) so the
  # trainer bootstraps on the same image that first yields a reconstruction.
  # Must be >= accumulation_views (2). Until /ingest brings the count to this,
  # the trainer idles "waiting for images" and bootstrap_complete stays false.
  min_images: 3

# ---------------------------------------------------------------------------
# training — substantive knobs for each action.
# ---------------------------------------------------------------------------
training:
  # Number of view micro-batches per optimizer step (gradient accumulation).
  # MUST be <= bootstrap.min_images (3).
  accumulation_views: 2

  # Hard VRAM-bounded ceiling on total Gaussian count. lightweight_prune
  # auto-fires above num_max_ceiling * 0.85 regardless of state to keep
  # the model under cap.
  num_max_ceiling: 800000

  # Fraction of Gaussians to prune in lightweight_prune. Now uses argsort
  # so this is exactly the fraction pruned (modulo grace-protected rows),
  # not a value threshold that overshoots on ties.
  prune_ratio1: 0.125

  # Currently unused (legacy).
  prune_ratio2: 0.05

  # Below this sharpness, an SG axis is considered "dull" for cull_sg_axes.
  sharpness_threshold: 2.0

  # outdoor | indoor — affects how importance score is computed (which
  # camera-coverage and rendering signals weigh more).
  imp_metric: outdoor

  # 0 = compute importance using all cameras. N > 0 = randomly subsample N
  # cameras per scoring pass. Useful for large scenes; slight noise.
  imp_score_camera_subsample: 0

  # Per-Gaussian minimum observation count before densify considers it
  # eligible. Ignores Gaussians that haven't been seen enough yet.
  densify_min_obs: 8

  # densify fires only if ≥ this fraction of Gaussians are candidates
  # (have high gradient or are in the blur mask). Suppresses futile fires
  # when gradient signal is weak across the board.
  densify_candidate_fraction: 0.001

  # fast_prune fires only if ≥ this fraction of Gaussians have opacity
  # below the dead-threshold. Suppresses no-op prunes.
  fast_prune_dead_fraction: 0.02

  # lightweight_prune fires when N has grown ≥ this fraction since the
  # last prune AND state allows. Raise to make prune more reluctant.
  lightweight_prune_growth_threshold: 0.10

  # cull_sg_axes fires only when ≥ this fraction of axes are below
  # sharpness_threshold. Higher = more reluctant culling.
  sg_axis_cull_low_fraction: 0.20

  # Currently unused (legacy).
  fast_final_prune_ratio: 0.10

  # Importance sampling on rendering loss. When true, bias view selection
  # toward images with high recent loss EMA — useful when new images get
  # added mid-training and their gradient signal would otherwise be
  # drowned out by well-fit older images. Loss-gradient weighting
  # (cam_w * base_loss) still uses raw match-matrix weights only, to avoid
  # double-counting.
  image_error_weighting: true
  # EMA decay on per-image base_loss. Higher = smoother, slower to react;
  # lower = more responsive but noisier. 0.95 → half-life of ~14 samples.
  image_error_ema_beta: 0.95
  # Crash resilience: persist train_state.pt (model + Adam + monitor +
  # ingest ledger) every N optimizer iters; restart with --resume to
  # continue the session. 0 disables periodic saves (a save still happens
  # at each converged-idle transition).
  train_state_interval_iters: 500

# ---------------------------------------------------------------------------
# dense_init — per-image dense seeding via Depth-Anything-V2 on each ingest.
# ---------------------------------------------------------------------------
dense_init:
  enabled: true

  # Monocular-depth backend: dav2 | da3. DA3 is the default on the 6 GB
  # target: DA3-SMALL fits, and it conditions depth on the COLMAP intrinsics
  # (FOV prior) which dav2 cannot. Set back to dav2 to use disparity depth.
  backend: da3

  # Run DA3 only (no DAv2 fallback). When DA3's RANSAC fit is bad (a <= 0)
  # for an image, skip that image's dense-init rather than retrying it with
  # DAv2 — SfM points still seed it. Flip to true to re-enable the fallback.
  da3_fallback_to_dav2: false

  # Depth Anything 3 settings (used when backend: da3).
  da3:
    # HF repo id. DA3-SMALL is the 6 GB-safe start; DA3-BASE next;
    # DA3MONO-LARGE / DA3METRIC-LARGE only after checking headroom.
    model_name: "depth-anything/DA3-SMALL"
    device: "cuda"
    process_res: 504
    # Condition depth on the COLMAP intrinsics (FOV prior).
    conditioning: true
    # Also condition on extrinsics. OFF: we run DA3 one image at a time and
    # its pose alignment (Umeyama Sim(3)) is rank-degenerate for a single
    # view. Only enable alongside a multi-view batch path.
    condition_extrinsics: false
    use_ray_pose: false

  # Skip dense-init if the new image has fewer than this many SfM points
  # available for monocular-depth-to-SfM alignment.
  min_sfm_points_for_alignment: 10

  # Skip if the SfM depth range is degenerate (too narrow to fit a depth
  # alignment confidently).
  min_sfm_depth_range_fraction: 0.10

  # Cap on Gaussians seeded from a single new image. Hard ceiling on per-
  # ingest growth.
  target_dense_points_per_image: 30000

  # Dense points within this distance (relative to scene scale) of an
  # existing Gaussian are considered redundant and dropped.
  novelty_distance_threshold: 0.01

  # Per-pixel sanity filter: reject dense points whose depth disagrees
  # with the SfM points projected to the same pixel by more than this
  # fraction. Bigger = more permissive.
  depth_disagreement_threshold: 0.10

  # If the sanity filter rejects more than this fraction of pixels, skip
  # the image entirely (depth alignment likely failed).
  max_rejected_fraction: 0.5

  # Number of iters that newly-added Gaussians are protected from any
  # prune. Raise if newcomers get pruned before they're observed enough.
  grace_iters: 20

  # Cap on the viewer's lightweight dense preview cloud (dense.ply =
  # accumulated DA3 dense + current sparse points). Above this the dense
  # points are uniformly subsampled so the cloud stays fast to fetch, kept
  # separate from the heavy splat set (latest.ply). 0 disables the cap.
  preview_max_points: 100000

  persist_model: false

  # Depth-Anything-V2 model config.
  dav2:
    model_size: large
    input_resolution: 518
    device: cuda
    fp16: false

  # RANSAC fitting depth → SfM (affine: a * d + b).
  ransac:
    iterations: 200
    inlier_threshold: 0.05
    min_inliers: 8

# ---------------------------------------------------------------------------
# http — control server bind.
# ---------------------------------------------------------------------------
http:
  host: "127.0.0.1"
  # Matches the home-server's TRAINER_URL default (http://127.0.0.1:8666).
  port: 8666
  # Max seconds a POST /checkpoint will block waiting for the trainer to
  # actually write the .ply. 0 = no timeout.
  checkpoint_timeout: 30
  # Max seconds a POST /pause blocks for the trainer to move its model to CPU
  # and free VRAM before COLMAP runs. Matches the home-server's 30 s block.
  pause_timeout: 30
